<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123d2a">
  <title>Member Registration | Unity Cooperative</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f7f4;
      color: #183629;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: white;
      padding: 28px 24px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .logo {
      width: 60px;
      height: 60px;
      background: #176b43;
      color: white;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 23px;
      font-weight: bold;
      margin: 0 auto 15px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 10px;
    }

    .intro {
      text-align: center;
      color: #68766e;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd8cf;
      border-radius: 9px;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #176b43;
      border-color: #176b43;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: none;
      border-radius: 9px;
      background: #176b43;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    a {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #176b43;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }
  </style></head><body>
  <main class="card">
    <div class="logo">UC</div><h1>Create Your Account</h1>

<p class="intro">
  Join Unity Cooperative to access your membership,
  savings and loan records.
</p>

<form id="registerForm">
  <label for="fullName">Full name</label>
  <input
    type="text"
    id="fullName"
    autocomplete="name"
    maxlength="100"
    required
  >

  <label for="email">Email address</label>
  <input
    type="email"
    id="email"
    autocomplete="email"
    required
  >

  <label for="phone">Phone number</label>
  <input
    type="tel"
    id="phone"
    autocomplete="tel"
    maxlength="25"
    required
  >

  <label for="password">Password</label>
  <input
    type="password"
    id="password"
    autocomplete="new-password"
    minlength="8"
    required
  >

  <label for="confirmPassword">Confirm password</label>
  <input
    type="password"
    id="confirmPassword"
    autocomplete="new-password"
    minlength="8"
    required
  >

  <button type="submit" id="registerButton">
    Create Account
  </button>
</form>

<div id="message" role="status" aria-live="polite"></div>

<a href="login.html">Already have an account? Log in</a>
<a href="index.html">Back to Homepage</a>

  </main>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script src="supabase.js"></script>  <script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const button = document.getElementById("registerButton");

    function showMessage(text, success) {
      message.style.display = "block";
      message.style.background = success ? "#dcfce7" : "#fee2e2";
      message.style.color = success ? "#166534" : "#991b1b";
      message.textContent = text;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (fullName.length < 2) {
        showMessage("Please enter your full name.", false);
        return;
      }

      if (password.length < 8) {
        showMessage("Your password must contain at least 8 characters.", false);
        return;
      }

      if (password !== confirmPassword) {
        showMessage("Your passwords do not match.", false);
        return;
      }

      if (!window.unitySupabase) {
        showMessage(
          "The connection is not ready. Check your internet and refresh the page.",
          false
        );
        return;
      }

      button.disabled = true;
      button.textContent = "Creating account...";
      showMessage("Please wait while your account is created.", true);

      try {
        const { data, error } = await window.unitySupabase.auth.signUp({
email,
password,
options: {
emailRedirectTo: window.location.origin + "/login.html",
data: {
full_name: fullName,
phone: phone
}
}
});

        if (error) {
          throw error;
        }

        if (data.user && data.session) {
          showMessage(
            "Your account was created. Your member profile is being set up. You can now try logging in.",
            true
          );

          form.reset();

          setTimeout(function() {
            window.location.href = "login.html";
          }, 2500);
        } else if (data.user) {
          showMessage(
            "Your registration request was received. Check your email for a verification link if required. After verification, return to the login page.",
            true
          );

          form.reset();
        } else {
          showMessage(
            "We could not confirm account creation. Please try again.",
            false
          );
        }

      } catch (error) {
        console.error("Registration error:", error);
        showMessage(
          error.message || "Registration failed. Please try again.",
          false
        );
      } finally {
        button.disabled = false;
        button.textContent = "Create Account";
      }
    });
  </script></body>
</html>
